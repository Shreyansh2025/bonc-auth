[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonc-auth"
version = "0.1.0"
description = "Reusable BONC authentication integrations for Flask and FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "BONC Auth Contributors" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
flask = ["Flask>=2.3"]
fastapi = ["fastapi>=0.110"]
all = ["Flask>=2.3", "fastapi>=0.110"]
dev = ["build>=1.2", "pytest>=8.0", "Flask>=2.3", "fastapi>=0.110"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bonc_auth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
